name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Build da imagem de produção
        run: docker build --target runtime -t akcit-qa:ci .
      - name: Pi, navegador, cursor e vídeo dentro do container
        run: >-
          docker run --rm --cpus=1 --memory=2g --shm-size=512m
          --cap-drop=ALL --security-opt=no-new-privileges --read-only
          --tmpfs /tmp:rw,size=512m,mode=1777
          --tmpfs /home/node:rw,size=128m,uid=1000,gid=1000,mode=0700
          --tmpfs /data:rw,size=128m,uid=1000,gid=1000,mode=0700
          akcit-qa:ci node scripts/smoke-runtime.mjs
