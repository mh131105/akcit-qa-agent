name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Build da imagem de produção
        run: docker build --target runtime -t akcit-qa:ci .
      - name: Pi, navegador, cursor e vídeo dentro do container
        run: >-
          docker run --rm --cpus=1 --memory=2g --shm-size=512m
          --cap-drop=ALL --security-opt=no-new-privileges --read-only
          --tmpfs /tmp:rw,size=512m,mode=1777
          --tmpfs /home/node:rw,size=128m,uid=1000,gid=1000,mode=0700
          --tmpfs /data:rw,size=128m,uid=1000,gid=1000,mode=0700
          akcit-qa:ci node scripts/smoke-runtime.mjs
      - name: Jornada web com API e armazenamento temporários na imagem final
        run: |
          mkdir -p artifacts/web
          chmod 777 artifacts/web
          docker run --rm --cpus=1 --memory=2g --shm-size=512m \
            --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,size=512m,mode=1777 \
            --tmpfs /home/node:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /data:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            -e SMOKE_ARTIFACT_DIR=/evidence -v "$PWD/artifacts/web:/evidence" \
            akcit-qa:ci node scripts/smoke-web.mjs
      - name: Jornada do alvo controlado de reservas na imagem final
        run: |
          mkdir -p artifacts/target
          chmod 777 artifacts/target
          docker run --rm --cpus=1 --memory=2g --shm-size=512m \
            --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,size=512m,mode=1777 \
            --tmpfs /home/node:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /data:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            -e SMOKE_ARTIFACT_DIR=/evidence -v "$PWD/artifacts/target:/evidence" \
            akcit-qa:ci node scripts/smoke-target.mjs
      - name: Mapeamento visual com navegador/tools reais e modelo substituído
        run: |
          mkdir -p artifacts/mapping
          chmod 777 artifacts/mapping
          docker run --rm --cpus=1 --memory=2g --shm-size=512m \
            --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,size=512m,mode=1777 \
            --tmpfs /home/node:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /data:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            -e SMOKE_ARTIFACT_DIR=/evidence -v "$PWD/artifacts/mapping:/evidence" \
            akcit-qa:ci node scripts/smoke-mapping.mjs
      - name: Execução visual por caso com navegador/tools reais e modelos substituídos
        run: |
          mkdir -p artifacts/execution
          chmod 777 artifacts/execution
          docker run --rm --cpus=1 --memory=2g --shm-size=512m \
            --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,size=512m,mode=1777 \
            --tmpfs /home/node:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /data:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            -e SMOKE_ARTIFACT_DIR=/evidence -v "$PWD/artifacts/execution:/evidence" \
            akcit-qa:ci node scripts/smoke-execution.mjs
      - name: Evidências sintéticas da interface
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-smoke
          path: artifacts/web/
          if-no-files-found: ignore
          retention-days: 14
      - name: Evidências do alvo controlado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: target-smoke
          path: artifacts/target/
          if-no-files-found: ignore
          retention-days: 14
      - name: Evidências do mapeamento visual
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-smoke
          path: artifacts/mapping/
          if-no-files-found: ignore
          retention-days: 14
      - name: Evidências da execução visual
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: execution-smoke
          path: artifacts/execution/
          if-no-files-found: ignore
          retention-days: 14
