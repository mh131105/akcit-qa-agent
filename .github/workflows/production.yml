name: Promover produção
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  actions: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run check && npm test
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Promover a mesma imagem aprovada em desenvolvimento
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/github-deploy.sh production
