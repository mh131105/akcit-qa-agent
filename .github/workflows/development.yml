name: Publicar desenvolvimento
on:
  push:
    branches: [develop]
permissions:
  contents: read
  packages: write
  actions: read
concurrency:
  group: deploy-development
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run check && npm test
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: source
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VCS_TREE=${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Verificar runtime antes de publicar
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: >-
          docker run --rm --cpus=1 --memory=2g --shm-size=512m
          --cap-drop=ALL --security-opt=no-new-privileges --read-only
          --tmpfs /tmp:rw,size=512m,mode=1777
          --tmpfs /home/node:rw,size=128m,uid=1000,gid=1000,mode=0700
          --tmpfs /data:rw,size=128m,uid=1000,gid=1000,mode=0700
          "$IMAGE" node scripts/smoke-runtime.mjs
      - name: Verificar jornada web antes de publicar
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          mkdir -p artifacts/web
          chmod 777 artifacts/web
          docker run --rm --cpus=1 --memory=2g --shm-size=512m \
            --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,size=512m,mode=1777 \
            --tmpfs /home/node:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /data:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            -e SMOKE_ARTIFACT_DIR=/evidence -v "$PWD/artifacts/web:/evidence" \
            "$IMAGE" node scripts/smoke-web.mjs
      - name: Verificar execução visual antes de publicar
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: >-
          docker run --rm --cpus=1 --memory=2g --shm-size=512m
          --cap-drop=ALL --security-opt=no-new-privileges --read-only
          --tmpfs /tmp:rw,size=512m,mode=1777
          --tmpfs /home/node:rw,size=128m,uid=1000,gid=1000,mode=0700
          --tmpfs /data:rw,size=128m,uid=1000,gid=1000,mode=0700
          "$IMAGE" node scripts/smoke-execution.mjs
      - name: Evidências sintéticas da interface
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-smoke-development
          path: artifacts/web/
          if-no-files-found: ignore
          retention-days: 14
      - id: publish
        name: Publicar imagem imutável
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          docker push "$IMAGE"
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Implantar e verificar desenvolvimento
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/github-deploy.sh development
