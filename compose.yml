name: akcit-qa-local
services:
  app:
    build:
      context: .
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      HOST: 0.0.0.0
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./src:/app/src:ro
      - ./agents:/app/agents:ro
      - ./test:/app/test:ro
      - local_data:/data
    cpus: 1.0
    mem_limit: 2g
    shm_size: 512m
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  local_data:
